[project]
name = "langchain-demo"
version = "0.1.0"
description = "RAG demo on Bedrock with S3 Vectors and Knowledge Bases"
readme = "README.md"
authors = [
    { name = "susinha", email = "sushil.sinha@here.com" }
]
requires-python = ">=3.14"
dependencies = [
    "boto3>=1.44.4",
    "langchain>=1.5.0",
    "langchain-aws>=1.9.3",
    "langchain-core>=1.8.1",
    "langchain-text-splitters>=1.1.3",
    "python-dotenv>=1.2.4",
]

[project.scripts]
langchain-demo = "langchain_demo:main"

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "pytest>=9.2.0",
    "ruff>=0.17.5",
]
